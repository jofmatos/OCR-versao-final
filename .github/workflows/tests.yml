name: Testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - uses: actions/cache@v4
        with:
          path: .cache/tessdata
          key: tessdata-best-${{ hashFiles('scripts/download_models.py') }}
      - run: bash scripts/setup.sh --dev
      - run: TESSDATA_PREFIX="$PWD/.cache/tessdata" .venv/bin/python -m pytest
