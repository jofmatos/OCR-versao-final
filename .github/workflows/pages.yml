name: Publicar Lume OCR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  mac-vision:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-mac-vision.sh
      - run: python3 scripts/smoke_mac_vision.py --executable ".cache/mac-build/Lume OCR Mac.app/Contents/MacOS/LumeOCRMac"
      - uses: actions/upload-artifact@v4
        with:
          name: lume-mac-vision
          path: .cache/mac-build/Lume-OCR-Mac.zip

  build:
    needs: mac-vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lume-mac-vision
          path: .cache/mac-build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/browser/paddle-dictionary.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
