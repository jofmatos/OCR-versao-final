name: Publicar Lume OCR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  neural-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        candidate: [glm, lighton]
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install playwright==1.58.0 pymupdf==1.26.7 pillow==12.1.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/prepare_neural_model.py --candidate all
      - run: python3 scripts/benchmark_neural_models.py --candidate ${{ matrix.candidate }}
        continue-on-error: true
        env:
          LUME_REQUIRE_NEURAL_MODEL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lume-neural-candidate-${{ matrix.candidate }}
          path: test-results/neural

  select-neural-model:
    needs: neural-ocr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: lume-neural-candidate-*
          path: .cache/candidate-results
      - id: model
        run: python3 scripts/benchmark_neural_models.py --select-results .cache/candidate-results
      - name: 'OCR selecionado: ${{ steps.model.outputs.model_name }} · ${{ steps.model.outputs.model_mib }} MiB'
        run: python3 -c "import json; print(json.load(open('.cache/neural-model.json'))['name'])"
      - uses: actions/upload-artifact@v4
        with:
          name: lume-neural-model
          path: |
            .cache/neural-model.json
            .cache/neural-comparison.json

  mac-vision:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-mac-vision.sh
      - run: python3 scripts/smoke_mac_vision.py --executable ".cache/mac-build/Lume OCR Mac.app/Contents/MacOS/LumeOCRMac"
      - uses: actions/upload-artifact@v4
        with:
          name: lume-mac-vision
          path: .cache/mac-build/Lume-OCR-Mac.zip

  build:
    needs: [mac-vision, select-neural-model]
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      LUME_REQUIRE_NEURAL_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lume-mac-vision
          path: .cache/mac-build
      - uses: actions/download-artifact@v4
        with:
          name: lume-neural-model
          path: .cache
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/browser/paddle-dictionary.test.mjs
      - run: node tests/browser/neural-policy.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
